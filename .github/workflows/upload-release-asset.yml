name: upload-release-asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      asset:
        description: Repository-relative asset path
        required: true
      ref:
        description: Git ref containing the asset (defaults to the release tag)
        required: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Attach asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ inputs.asset }}" --clobber
